<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="login-container">

        <div class="login-box">

            <form id="loginForm">

                <input
                    type="text"
                    id="loginUsername"
                    placeholder="username"
                    required
                >

                <input
                    type="password"
                    id="loginPassword"
                    placeholder="password"
                    required
                >

                <button type="submit">
                    LOGIN
                </button>

            </form>

            <p class="register-text">
                Not registered?
                <a href="register.html">Create an account</a>
            </p>

            <p id="loginMessage"></p>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
